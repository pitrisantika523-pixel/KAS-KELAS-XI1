<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAS KELAS XI 1</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-animation"></div>

    <div class="container">
        <!-- HEADER UTAMA -->
        <header class="main-header">
            <div class="flag-icon">🇮🇩</div>
            <h1 class="judul-utama">KAS KELAS XI 1</h1>
            <div class="wali-kelas">👩‍🏫 WALI KELAS: BU KHANSA</div>
            <div class="garis-bawah">━━━━━━━━━━━━━━━━━━━━━━━━━</div>
            <div id="user-area" class="user-area"></div>
        </header>

        <!-- LOGIN/DAFTAR -->
        <div id="auth-box" class="card auth-box hidden">
            <div class="auth-header">
                <h2>SELAMAT DATANG! 👋</h2>
                <p>Silakan Login atau Buat Akun</p>
            </div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('login')">🔐 Login</button>
                <button class="tab-btn" onclick="switchTab('daftar')">📝 Daftar</button>
            </div>
            <div id="login-form">
                <input type="text" id="user" placeholder="👤 Username" class="input-besar">
                <input type="password" id="pass" placeholder="🔒 Password" class="input-besar">
                <button onclick="login()" class="btn-besar">MASUK SEKARANG 🚪</button>
            </div>
            <div id="daftar-form" class="hidden">
                <input type="text" id="new-user" placeholder="✏️ Username Baru" class="input-besar">
                <input type="password" id="new-pass" placeholder="🔑 Password Baru" class="input-besar">
                <button onclick="daftar()" class="btn-besar">BUAT AKUN ✅</button>
            </div>
            <p id="msg" class="pesan"></p>
        </div>

        <!-- SALDO -->
        <div class="card saldo-card">
            <h2 class="label-saldo">💰 SALDO KAS KELAS SAAT INI</h2>
            <p class="angka-saldo" id="saldo">Rp 0</p>
            <div class="tanggal-sekarang" id="tanggal-sekarang"></div>
        </div>

        <!-- LOMBA SETORAN BULAN INI -->
        <div class="card lomba-card">
            <h2 class="lomba-judul">🏆 LOMBA SETORAN — <span id="bulan-ini"></span></h2>
            <div id="peringkat-list"></div>
        </div>

        <!-- FORM TAMBAH TRANSAKSI (ADMIN SAJA) -->
        <div id="add-form" class="card form-tambah hidden">
            <h2 class="form-judul">➕ TAMBAH TRANSAKSI</h2>
            <input type="text" id="nama" placeholder="👤 Nama Siswa" class="input-besar">
            <select id="jenis" class="input-besar">
                <option value="masuk">💰 KAS MASUK (Bayar Kas)</option>
                <option value="keluar">💸 KAS KELUAR (Pengeluaran)</option>
            </select>
            <input type="number" id="jumlah" placeholder="💵 Jumlah Uang (Rp)" class="input-besar">
            <input type="text" id="ket" placeholder="📝 Keterangan" class="input-besar">
            <input type="text" id="komentar" placeholder="💬 Komentar/Catatan Tambahan" class="input-besar">
            <button onclick="tambah()" class="btn-simpan">✅ SIMPAN DATA</button>
        </div>

        <!-- RIWAYAT TRANSAKSI -->
        <div class="card riwayat-card">
            <h2 class="riwayat-judul">📋 RIWAYAT LENGKAP TRANSAKSI</h2>
            <div id="list"></div>
        </div>

        <!-- BELUM BAYAR KAS -->
        <div class="card belum-bayar-card">
            <h2 class="belum-judul">⚠️ BELUM MEMBAYAR KAS</h2>
            <div id="belum-list"></div>
        </div>

        <footer class="footer">
            <p>🇮🇩 KAS KELAS XI 1 — Wali Kelas: Bu Khansa 🇮🇩</p>
        </footer>
    </div>

<script src="/static/script.js"></script>
</body>
</html>
